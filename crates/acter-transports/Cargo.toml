[package]
name = "acter-transports"
description = "Adapters: byte transports to shells (scripted; local ConPTY and SSH later) behind the Transport port."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The port this crate implements, plus the `Clock` port every scripted delay waits on.
acter-core = { path = "../acter-core" }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The scripted transport spawns its own emission loop, as `SystemClock` spawns its own
# sleep: "rt" for the spawn, "sync" for the channels it emits and is written to through.
tokio = { version = "1", features = ["rt", "sync"] }

# One call, in `LocalPty::spawn`: `SetConsoleCtrlHandler(NULL, FALSE)` before the shell is
# spawned, so the shell does not inherit an "ignore Ctrl+C" attribute from however Acter
# was launched (spec B4.1, decision 1). Windows-only and one feature only — the Unix arm
# needs nothing, because a bare `0x03` on a Unix pty is turned into `SIGINT` by the line
# discipline.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
# The full-pipeline test replays a transcript through the real terminal engine. A
# dev-dependency only: nothing in this crate's library touches an emulator.
acter-term = { path = "../acter-term" }
# "time" and "rt-multi-thread" are the real-shell tests' alone (tests/local_pty.rs): they
# drive a process nobody scripted, so they need a real timeout to fail on rather than a
# fake clock to advance, and a reading thread that can make progress while the test awaits.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
