[package]
name = "acter-core"
description = "Acter domain: entities, policies, ports, services, IPC protocol types. No I/O."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
specta = { version = "2.0.0-rc.25", features = ["derive"] }
# Port error types with speakable `Display` strings; ARCHITECTURE prescribes it for
# library crates (`anyhow` stays confined to acter-app).
thiserror = "2"
# Primitives, not the runtime: no "rt" feature, so this crate structurally cannot spawn
# a task or build a runtime. The session actor exposes `run()` as a future and the
# composition root spawns it (spec B1.5, decision 2).
tokio = { version = "1", features = ["macros", "sync"] }

[dev-dependencies]
# Property tests over arbitrary marker streams (ARCHITECTURE, test tier 1).
proptest = "1"
serde_json = "1"
# Tests need a runtime to drive the actor's loop; the library still does not.
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[lints]
workspace = true
