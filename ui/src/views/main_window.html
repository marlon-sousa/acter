<!doctype html>
<!-- Role: view (main window) — declarative HTML, one file per window. The static
     semantic skeleton (roles, labels, live region) lives here so it is inspectable
     without executing anything; dynamic DOM behavior lives only in src/adapters/. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acter</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- The menu bar lives in the document rather than in the window frame. A native
         Win32 menu was measured first (spec A7) and freezes NVDA for tens of seconds
         every time it opens, in Acter and in a twenty-line Tauri application alike,
         because the menu's modal loop blocks the accessibility calls the reader makes
         into the webview. An in-document menu bar never takes focus out of the webview,
         so none of that applies.

         The structure is the WAI-ARIA menubar pattern, written out statically here so it
         is inspectable without executing anything; the keyboard behaviour is in
         src/adapters/menu_bar.ts. One item carries tabindex="0" so Tab reaches the bar;
         the adapter moves that as focus moves (roving tabindex).

         **Windows only, and hidden until the platform says so.** A native menu bar is
         the right thing on macOS, where it lives in the system bar rather than in the
         window, and probably on Linux too; what is measured here is Windows, where a
         native `HMENU` freezes the reader. So this region starts `hidden` and
         src/main.ts reveals it only on Windows, removing it entirely elsewhere rather
         than leaving an empty landmark in the document.

         **`role="application"` around it, deliberately.** NVDA reads a document in browse
         mode, where the arrows move its own cursor rather than reaching the widget, and it
         only switches to focus mode by itself if the user has left that setting on — which
         is a setting, not a guarantee. A menu bar whose arrows depend on somebody's
         configuration is not a menu bar, so the wrapper states that this subtree is an
         application and the keys belong to it. It wraps only the bar: the buffer and the
         edit field are still an ordinary document, where browse mode is exactly what a
         reader wants. -->
    <div id="menu-bar-region" role="application" aria-label="Acter menu bar" hidden>
      <ul id="menu-bar" role="menubar" aria-label="Acter">
        <li role="none">
          <span
            role="menuitem"
            id="menu-acter"
            aria-haspopup="true"
            aria-expanded="false"
            tabindex="0"
            >Acter</span
          >
          <ul role="menu" aria-label="Acter" hidden>
            <!-- Connect comes before Exit because it is what this menu is mostly opened
                 for: since B7 a window starts connected to nothing, and this item is the
                 only way out of that state (spec A8). -->
            <li role="none">
              <span role="menuitem" id="menu-connect" tabindex="-1">Connect</span>
            </li>
            <li role="none">
              <span role="menuitem" id="menu-exit" tabindex="-1">Exit</span>
            </li>
          </ul>
        </li>
        <li role="none">
          <span
            role="menuitem"
            id="menu-about"
            aria-haspopup="true"
            aria-expanded="false"
            tabindex="-1"
            >About</span
          >
          <ul role="menu" aria-label="About" hidden>
            <li role="none">
              <span role="menuitem" id="menu-about-acter" tabindex="-1">About Acter</span>
            </li>
          </ul>
        </li>
      </ul>
    </div>
    <main>
      <!-- The document's top, and what `Ctrl+Home` and heading navigation land on. It says
           the same thing as the window title, from the same value, because two titles that
           can disagree eventually will (spec A9, decision 1). Level 1, with command blocks
           at level 2, which is the structure the buffer already implied. -->
      <h1 id="window-title">Acter</h1>
      <!-- **The terminal window**: one session's results buffer and its edit field, which
           are one thing rather than two that happen to sit together. Phase 1 has exactly one
           and it lives here; **tabs make this many**, one per session, and this wrapper is
           where that change will land — so the two halves are grouped now rather than being
           untangled from `<main>` later (DESIGN, one session per tab).

           It carries no role and no label deliberately: an unnamed `div` is invisible to a
           screen reader, so grouping the two costs a listener nothing today and gives the
           tab panel a place to be when it exists.

           There is no `hidden` on the wrapper itself. Its two halves each know when they
           belong in the document, and a wrapper whose children are both hidden is already
           nothing at all to a reader. -->
      <div id="terminal">
      <!-- The results buffer is a document and must stay one: browse mode is how a
           listener reads output back, heading by heading, and `role="application"`
           here would take that away.

           **Hidden while it is empty** (spec A10). A region with nothing in it is a thing a
           listener arrows onto and hears nothing useful from, and since B7 an empty buffer
           is what every launch opens with rather than a state that lasts until a prompt
           arrives. It appears with its first content and stays afterwards — including after
           the far end has gone, because by then it is the record of what happened. -->
      <div id="results" role="region" aria-label="Results" tabindex="-1" hidden></div>
      <!-- The command line is deliberately NOT an application, and it was tried the
           other way first. Wrapping it does force focus mode, so typed letters are text
           rather than quick-navigation — but it also removes the browsable document
           here, and with it a workflow this product exists to serve: turning focus mode
           off at the edit field and arrowing up to hear the tail of the last command.
           Measured with the tester's NVDA on 2026-08-24: wrapped, the edit field cannot
           be put into browse mode at all. Reading the output wins; the mode at the
           command line stays the reader's own business. The menu bar keeps its wrapper,
           because there the arrows must belong to the widget and there is nothing to
           read. -->
      <form id="command-form" hidden>
        <label for="command-input">Command input</label>
        <input
          id="command-input"
          type="text"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
      </form>
      </div>
      <!-- What a window with no session shows instead of the edit field (spec A10).

           **A button rather than an instruction.** B7's window told the listener to press
           F10 and find Connect in a menu, which is a route to describe rather than a thing
           to do; this is one control, under focus when the window opens, and Enter connects.
           The menu item stays, because a menu is where a user looks for a command they
           already know.

           It carries the state as well as the action: a listener arriving here reads "not
           connected" before the button that answers it. The status bar says the same thing
           at the foot of the window, and that is not a duplicate — one is what you read on
           the way past, the other is what announces itself when it changes. -->
      <div id="not-connected">
        <p>Not connected.</p>
        <!-- **`role="application"` around the button alone**, and for A7's measured reason
             applied to a new place. NVDA reads a freshly opened document in browse mode,
             where Enter acts on its own cursor rather than on the focus — and the cursor
             ends up wherever NVDA's initial read of the document finished, which is not the
             control the window put focus on. Measured 2026-08-26: the window opened with
             this button focused and announced, and Enter did nothing at all because the
             cursor was sitting on the status bar.

             The wrapper says the keys in here belong to the widget, so focus mode applies
             and Enter presses what is focused. It covers the button only: the line above it
             stays ordinary browsable text, which is what a listener reading the window
             top to bottom needs to meet. -->
        <div role="application">
          <button id="connect-button" type="button">Connect</button>
        </div>
      </div>
    </main>
    <!-- The status bar, at the end of the document the way a status bar sits at the bottom
         of a window, and reachable three ways.
         `<footer>` as a direct child of `<body>` is the `contentinfo` landmark, so landmark
         navigation finds it; `aria-label` names it, so arriving there says what it is rather
         than reading a bare word; and `role="status"` on the text makes a change announce
         itself politely — never interrupting output being read, never taking focus, because
         the state changes while the user is busy elsewhere (spec A9, decision 2).
         The label is on the landmark and not on the live region deliberately: a name on the
         region itself is read out with every change, and "connection status connected" every
         time is the sort of repetition a listener learns to tune out. -->
    <footer aria-label="Connection status">
      <p id="connection-status" role="status">connecting</p>
    </footer>
    <!-- About. A modal <dialog> rather than a native window: the platform traps focus
         and answers Escape for us, and it stays inside the webview, which is the whole
         reason the menu bar above is in the document too (spec A7). Its four facts are
         filled from the build by adapters/about_dialog.ts. -->
    <dialog id="about-dialog" aria-labelledby="about-title">
      <h1 id="about-title">About Acter</h1>
      <p id="about-name"></p>
      <p id="about-version"></p>
      <p id="about-copyright"></p>
      <p id="about-licence"></p>
      <button id="about-close" type="button">Close</button>
    </dialog>
    <!-- Connect. A modal <dialog> for About's reasons, and one more of its own: a failed
         connection has to leave the user somewhere they can try again, which a submenu
         that closed on activation could never do (spec A8, decision 4).

         **Two parts**: a list of connection kinds, and a panel below it holding whatever
         that kind needs — nothing for cmd, the installed distributions for WSL, and the
         reason plus the instructions for a kind this machine cannot start. Both are filled
         by adapters/connect_dialog.ts from `connectable()`, asked fresh every time this
         opens, so a distribution installed while Acter is running appears with no restart.

         **`role="application"` around the kinds list only**, and for A7's measured reason:
         NVDA reads a document in browse mode, where the arrows move its own cursor rather
         than reaching the widget, and it switches to focus mode by itself only if the user
         left that setting on — which is a setting, not a guarantee. A list whose arrows
         depend on somebody's configuration is not a list. The wrapper covers the listbox
         and nothing else: the panel below it is read-only prose a listener has to be able
         to *read*, and instructions naming what to install would be unreachable inside an
         application region. -->
    <dialog id="connect-dialog" aria-labelledby="connect-title">
      <h1 id="connect-title">Connect</h1>
      <div role="application" aria-label="Connection kind">
        <ul
          id="connect-kinds"
          role="listbox"
          aria-label="Connection kind"
          tabindex="0"
        ></ul>
      </div>
      <!-- The panel names itself, because what it holds changes as the kind changes and a
           section a listener tabs into unannounced is the trap decision 2 exists to answer.
           Its heading text is rewritten with its contents. -->
      <div
        id="connect-panel"
        role="group"
        aria-labelledby="connect-panel-title"
        tabindex="-1"
      >
        <h2 id="connect-panel-title">Options</h2>
        <div id="connect-panel-body"></div>
      </div>
      <button id="connect-start" type="button">Connect</button>
      <button id="connect-cancel" type="button">Cancel</button>
      <!-- This dialog's own live region, and it is not a duplicate. `showModal` makes
           everything outside the dialog inert, so the announcer's region at the end of the
           document changes where no reader is listening — measured with NVDA on 2026-08-26,
           where arrowing this list said nothing about the panel at all. The announcer
           finds this by its `data-live-region` attribute while the dialog is open. -->
      <div
        data-live-region
        aria-live="polite"
        class="visually-hidden"
      ></div>
    </dialog>
    <!-- The live region lives at the very end of the document, outside <main>, and
         never moves. It must stay in the accessibility tree to be announced, so its
         text is browse-mode reachable while present; placing it last keeps it out of
         the most-travelled path (last command heading -> edit field), and the
         announcer adapter empties it shortly after each announcement. -->
    <div id="announcer" aria-live="polite" class="visually-hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
