name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: fmt, clippy, test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Frontend install
        run: npm ci
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm run test:ui
      - name: Frontend build
        run: npm -w acter-ui run build
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Protocol bindings up to date
        # `cargo test --workspace` above re-ran the generator (tests/protocol_bindings.rs),
        # rewriting ui/src/protocol.ts from the acter-core types. If the committed
        # binding was stale, the working tree now differs and this fails the build —
        # the single-source-of-truth guard for the wire protocol.
        run: git diff --exit-code ui/src/protocol.ts

  e2e:
    name: e2e (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: End-to-end tests
        # test:e2e builds the frontend, then a debug app binary with the
        # `custom-protocol` feature (without it Tauri serves `devUrl`, not the
        # embedded frontend; debug because the in-app WebDriver server is
        # registered under debug_assertions only), then runs the wdio suite.
        # No driver installs: WebdriverIO talks directly to the WebDriver server
        # embedded in the app; each spec spawns its own instance on a unique port.
        run: npm run test:e2e
      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore

  real-shell:
    name: real-shell (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Real-shell transport tests
        # `LocalPty` against a real `cmd.exe` on a real pseudoconsole. These spawn a
        # process, so they are `#[ignore]`d and invisible to `cargo test --workspace`
        # above — keeping the fast suite independent of what is installed on a machine
        # (spec B4, decision 10). `--nocapture` because one of them is a measurement
        # whose printed output is its point, and `--test-threads=1` because several
        # shells writing to pseudoconsoles at once makes a timeout look like a defect.
        run: >
          cargo test -p acter-transports --test local_pty --
          --ignored --nocapture --test-threads=1
      - name: Real-session tests
        # The whole stack against a real shell: `real_session.rs`, `#[ignore]`d for the
        # same reason and named separately because the step above targets one test file
        # by name. The nested case wants a Linux container and this runner has no Linux
        # daemon, so it detects that and skips itself — which is why this step is not
        # conditional on Docker: what runs here is the `cmd.exe` case, and the nested one
        # is run by hand on a machine that has one.
        run: >
          cargo test -p acter-transports --test real_session --
          --ignored --nocapture --test-threads=1
